<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A1: Hello World, GitHub and d3</title>
</head>
<body>
  <div id="container"></div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
    console.log("d3 version", d3.version); // test that d3 loaded
    // Add an SVG
    const SVG = d3.select("body")
      .append("svg")
      .attr("width", 1140)
      .attr("height", 650)
      .style("border", "1px solid #ccc");
      
    // Add Polygons
    SVG.append("polygon")
      .attr("points", "410,260 470,120 550,230")
      .attr("fill", "saddlebrown")

    SVG.append("polygon")
      .attr("points", "425,260 470,140 550,230")
      .attr("fill", "sandybrown")
   
    SVG.append("polygon")
      .attr("points", "600,260 660,120 730,260")
      .attr("fill", "saddlebrown")

    SVG.append("polygon")
      .attr("points", "615,260 660,140 720,260")
      .attr("fill", "sandybrown")
  
    // Add Circles
    SVG.append("circle")
      .attr("cx", 1140/2)
      .attr("cy", 380)
      .attr("r", 200)
      .attr("fill", "saddlebrown");

    SVG.append("ellipse")
      .attr("cx", 490)
      .attr("cy", 310)
      .attr("rx", 25)
      .attr("ry", 13)
      .attr("fill", "sandybrown");

    SVG.append("ellipse")
      .attr("cx", 650)
      .attr("cy", 310)
      .attr("rx", 25)
      .attr("ry", 13)
      .attr("fill", "sandybrown");

    // Add Lines
    SVG.append("line")
      .attr("x1", 575)
      .attr("y1", 380)
      .attr("x2", 575)
      .attr("y2", 460)
      .attr("stroke", "black")
      .attr("stroke-width", 5);

    SVG.append("line")
      .attr("x1", 573)
      .attr("y1", 460)
      .attr("x2", 610)
      .attr("y2", 450)
      .attr("stroke", "black")
      .attr("stroke-width", 5);

    SVG.append("line")
      .attr("x1", 573)
      .attr("y1", 460)
      .attr("x2", 540)
      .attr("y2", 450)
      .attr("stroke", "black")
      .attr("stroke-width", 5);

    SVG.append("line")
      .attr("x1", 460)
      .attr("y1", 410)
      .attr("x2", 390)
      .attr("y2", 400)
      .attr("stroke", "beige")
      .attr("stroke-width", 4);

    SVG.append("line")
      .attr("x1", 460)
      .attr("y1", 410)
      .attr("x2", 390)
      .attr("y2", 425)
      .attr("stroke", "beige")
      .attr("stroke-width", 4);

    SVG.append("line")
      .attr("x1", 460)
      .attr("y1", 410)
      .attr("x2", 390)
      .attr("y2", 445)
      .attr("stroke", "beige")
      .attr("stroke-width", 4);

    SVG.append("line")
      .attr("x1", 660)
      .attr("y1", 410)
      .attr("x2", 745)
      .attr("y2", 400)
      .attr("stroke", "beige")
      .attr("stroke-width", 4);

    SVG.append("line")
      .attr("x1", 660)
      .attr("y1", 410)
      .attr("x2", 745)
      .attr("y2", 420)
      .attr("stroke", "beige")
      .attr("stroke-width", 4);

    SVG.append("line")
      .attr("x1", 660)
      .attr("y1", 410)
      .attr("x2", 745)
      .attr("y2", 440)
      .attr("stroke", "beige")
      .attr("stroke-width", 4);
    
    // Add Rectangles
    SVG.append("rect")
      .attr("x", 1100/2)
      .attr("y", 380)
      .attr("width", 50)
      .attr("height", 30)
      .attr("fill", "pink");

  

    //Eyes
    SVG.append("circle")
      .attr("cx", 500)
      .attr("cy", 350)
      .attr("r", 15)
      .attr("fill", "black");

    SVG.append("circle")
      .attr("cx", 650)
      .attr("cy", 350)
      .attr("r", 15)
      .attr("fill", "black");

    SVG.append("circle")
      .attr("cx", 505)
      .attr("cy", 350)
      .attr("r", 3)
      .attr("fill", "white");
    
    SVG.append("circle")
      .attr("cx", 655)
      .attr("cy", 350)
      .attr("r", 3)
      .attr("fill", "white");


    // animation function
    function bob(sel){
      sel.transition()
        .duration(900)
        .ease(d3.easeCubicInOut)
        .attr("cy", d=>d - 10)
      .transition()
        .delay(900)
        .duration(900)
        .ease(d3.easeCubicInOut)
        .attr("cy", d=>d )
      .on("end", function () {
        d3.select(this).call(bob);
      });  
    }
    
    const ellipses = SVG.selectAll("ellipse")
      .datum(function () {
        return + this.getAttribute("cy")
      });

    ellipses.call(bob);
  </script>
</body>
</html>
